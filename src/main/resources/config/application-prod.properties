server.servlet.context-path=/citrus
server.port=8082

spring.datasource.url=jdbc:postgresql://db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=12345678

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAMESERVER:rmq-nameserver:9876}
rocketmq.producer.group=payment-poc-producer
rocketmq.producer.send-message-timeout=3000
# prod 不靠 broker autoCreate，由 RocketMQAdminBootstrap 啟動時建 topic
rocketmq.admin.bootstrap.enabled=true
