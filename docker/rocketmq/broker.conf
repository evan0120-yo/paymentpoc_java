# 本機開發用 broker 設定
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Host 設定：同時讓「host 上的 app」與「docker 網路內的 dashboard」都能連到 broker
# host.docker.internal 在 Docker Desktop (Windows/Mac) 原生支援
#   - host app → 解析為 127.0.0.1，走 port mapping
#   - 容器內    → 解析為 host 網關，走 port mapping
brokerIP1 = host.docker.internal
namesrvAddr = rmqnamesrv:9876

# dev 允許 broker 自動建立未存在的 topic（prod 改 false，改由 MQAdmin 管理）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
